server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/petdb?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  # MyBatis配置
mybatis:
    # MyBatis映射文件位置
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.tgwei.demopet.demos.web.entity  # 实体类所在包
    configuration:
      # 配置日志实现，这里选择标准输出
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      # 自动将下划线风格的列名转换为驼峰风格的属性名
      map-underscore-to-camel-case: true

pet:
  security:
    salt: "Pet@2025Sys"  # 密码加密盐值



